<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <radialGradient id="discGrad" cx="45%" cy="45%" r="50%">
      <stop offset="0%" stop-color="#E2E8F0"/>
      <stop offset="60%" stop-color="#CBD5E1"/>
      <stop offset="100%" stop-color="#94A3B8"/>
    </radialGradient>
    <linearGradient id="caliperGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FF2E36"/>
      <stop offset="60%" stop-color="#DC2626"/>
      <stop offset="100%" stop-color="#991B1B"/>
    </linearGradient>
    <filter id="shadowB" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-opacity="0.35"/>
    </filter>
  </defs>
  <g filter="url(#shadowB)">
    <!-- Drilled & Slotted Brake Rotor -->
    <circle cx="95" cy="105" r="78" fill="url(#discGrad)" stroke="#64748B" stroke-width="3"/>
    <circle cx="95" cy="105" r="72" fill="none" stroke="#94A3B8" stroke-width="1.5" stroke-dasharray="4 6"/>
    <circle cx="95" cy="105" r="42" fill="#1E293B" stroke="#475569" stroke-width="3"/>
    <!-- Rotor Slots -->
    <path d="M 75 45 Q 95 65 85 85 M 125 45 Q 115 65 125 85 M 145 75 Q 125 95 125 115 M 145 135 Q 125 125 105 135 M 65 155 Q 85 135 75 115 M 45 125 Q 65 105 55 85"
          stroke="#475569" stroke-width="2.5" stroke-linecap="round"/>
    <!-- Drill Holes -->
    <circle cx="80" cy="55" r="2.5" fill="#334155"/>
    <circle cx="115" cy="58" r="2.5" fill="#334155"/>
    <circle cx="140" cy="85" r="2.5" fill="#334155"/>
    <circle cx="138" cy="125" r="2.5" fill="#334155"/>
    <circle cx="105" cy="155" r="2.5" fill="#334155"/>
    <circle cx="68" cy="138" r="2.5" fill="#334155"/>
    <circle cx="55" cy="98" r="2.5" fill="#334155"/>
    <!-- Center Hub & 5 Stud Holes -->
    <circle cx="95" cy="105" r="24" fill="#0F172A"/>
    <circle cx="95" cy="90" r="4" fill="#E2E8F0"/>
    <circle cx="109" cy="100" r="4" fill="#E2E8F0"/>
    <circle cx="104" cy="116" r="4" fill="#E2E8F0"/>
    <circle cx="86" cy="116" r="4" fill="#E2E8F0"/>
    <circle cx="81" cy="100" r="4" fill="#E2E8F0"/>
    
    <!-- Big Red Multi-Piston Brembo Caliper (Top Right) -->
    <path d="M 115 28 C 145 35 170 60 178 92 C 168 96 158 98 146 88 C 140 76 130 64 116 56 C 114 46 114 36 115 28 Z"
          fill="url(#caliperGrad)" stroke="#7F1D1D" stroke-width="2"/>
    <circle cx="132" cy="52" r="5" fill="#F87171" opacity="0.8"/>
    <circle cx="148" cy="68" r="5" fill="#F87171" opacity="0.8"/>
    <circle cx="160" cy="85" r="5" fill="#F87171" opacity="0.8"/>
    <!-- Brembo text on caliper -->
    <text x="134" y="74" font-family="'Helvetica Neue', Arial, sans-serif" font-weight="900" font-size="9" fill="#FFFFFF" transform="rotate(35 134 74)">brembo</text>
  </g>
</svg>