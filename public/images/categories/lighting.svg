<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <linearGradient id="headlightBody" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#18181B"/>
      <stop offset="60%" stop-color="#09090B"/>
      <stop offset="100%" stop-color="#000000"/>
    </linearGradient>
    <radialGradient id="projectorGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#60A5FA"/>
      <stop offset="70%" stop-color="#2563EB"/>
      <stop offset="100%" stop-color="#1E3A8A"/>
    </radialGradient>
  </defs>
  <g transform="translate(15, 45)">
    <!-- Aerodynamic Headlight Housing -->
    <path d="M 10 70 Q 50 30 160 10 Q 150 65 110 80 Q 50 85 10 70 Z" fill="url(#headlightBody)" stroke="#3F3F46" stroke-width="2.5"/>
    <!-- LED Daytime Running Light (DRL) Strip -->
    <path d="M 25 64 Q 60 40 148 20" fill="none" stroke="#F36B16" stroke-width="5" stroke-linecap="round"/>
    <!-- Bi-Xenon / LED Projector Lens -->
    <circle cx="65" cy="55" r="18" fill="url(#projectorGlow)" stroke="#93C5FD" stroke-width="3"/>
    <circle cx="65" cy="55" r="8" fill="#FFFFFF"/>
    <!-- Secondary High Beam Lens -->
    <circle cx="110" cy="45" r="13" fill="url(#projectorGlow)" stroke="#93C5FD" stroke-width="2"/>
    <circle cx="110" cy="45" r="5" fill="#FFFFFF"/>
  </g>
</svg>