<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <linearGradient id="shockBody" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#4B5563"/>
      <stop offset="50%" stop-color="#1F2937"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="springYellow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#FEF08A"/>
      <stop offset="40%" stop-color="#FACC15"/>
      <stop offset="100%" stop-color="#CA8A04"/>
    </linearGradient>
  </defs>
  <g transform="rotate(45 100 100)">
    <!-- Top Pillowball Mount (Orange Anodized) -->
    <rect x="80" y="22" width="40" height="12" rx="3" fill="#F36B16" stroke="#9A3412" stroke-width="2"/>
    <!-- Chrome Piston Shaft -->
    <rect x="94" y="34" width="12" height="40" fill="#E2E8F0"/>
    <!-- Yellow Coil Spring -->
    <rect x="76" y="55" width="48" height="12" rx="6" fill="url(#springYellow)"/>
    <rect x="76" y="70" width="48" height="12" rx="6" fill="url(#springYellow)"/>
    <rect x="76" y="85" width="48" height="12" rx="6" fill="url(#springYellow)"/>
    <rect x="76" y="100" width="48" height="12" rx="6" fill="url(#springYellow)"/>
    <rect x="76" y="115" width="48" height="12" rx="6" fill="url(#springYellow)"/>
    <!-- Anodized Lower Locking Collars -->
    <rect x="82" y="128" width="36" height="7" fill="#F36B16"/>
    <rect x="82" y="137" width="36" height="7" fill="#F36B16"/>
    <!-- Threaded Damper Body -->
    <rect x="86" y="146" width="28" height="34" fill="url(#shockBody)"/>
    <!-- Bottom Bushing Ring -->
    <circle cx="100" cy="184" r="9" fill="none" stroke="#F36B16" stroke-width="4"/>
  </g>
</svg>