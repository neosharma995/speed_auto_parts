<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <linearGradient id="radTank" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#E2E8F0"/>
      <stop offset="50%" stop-color="#94A3B8"/>
      <stop offset="100%" stop-color="#64748B"/>
    </linearGradient>
  </defs>
  <g transform="translate(20, 40)">
    <!-- Left Tank -->
    <rect x="10" y="10" width="20" height="100" rx="4" fill="url(#radTank)" stroke="#334155" stroke-width="2"/>
    <!-- Inlet Hose Spout -->
    <rect x="0" y="24" width="12" height="16" rx="2" fill="#F36B16"/>
    <!-- Right Tank -->
    <rect x="130" y="10" width="20" height="100" rx="4" fill="url(#radTank)" stroke="#334155" stroke-width="2"/>
    <rect x="148" y="75" width="12" height="16" rx="2" fill="#F36B16"/>
    <!-- Radiator Fin Core -->
    <rect x="30" y="15" width="100" height="90" fill="#334155" stroke="#1E293B" stroke-width="2"/>
    <!-- Horizontal cooling fins -->
    <line x1="30" y1="25" x2="130" y2="25" stroke="#94A3B8" stroke-width="1.5"/>
    <line x1="30" y1="35" x2="130" y2="35" stroke="#94A3B8" stroke-width="1.5"/>
    <line x1="30" y1="45" x2="130" y2="45" stroke="#94A3B8" stroke-width="1.5"/>
    <line x1="30" y1="55" x2="130" y2="55" stroke="#94A3B8" stroke-width="1.5"/>
    <line x1="30" y1="65" x2="130" y2="65" stroke="#94A3B8" stroke-width="1.5"/>
    <line x1="30" y1="75" x2="130" y2="75" stroke="#94A3B8" stroke-width="1.5"/>
    <line x1="30" y1="85" x2="130" y2="85" stroke="#94A3B8" stroke-width="1.5"/>
    <line x1="30" y1="95" x2="130" y2="95" stroke="#94A3B8" stroke-width="1.5"/>
    <!-- Radiator Cap -->
    <polygon points="16,4 24,4 28,10 12,10" fill="#DC2626"/>
  </g>
</svg>