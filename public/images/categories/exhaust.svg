<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <linearGradient id="chromeGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F1F5F9"/>
      <stop offset="35%" stop-color="#94A3B8"/>
      <stop offset="55%" stop-color="#FFFFFF"/>
      <stop offset="80%" stop-color="#64748B"/>
      <stop offset="100%" stop-color="#334155"/>
    </linearGradient>
    <linearGradient id="blueHeat" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#3B82F6" stop-opacity="0.9"/>
      <stop offset="50%" stop-color="#8B5CF6" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#EC4899" stop-opacity="0.5"/>
    </linearGradient>
  </defs>
  <g transform="translate(15, 20)">
    <!-- Muffler Body -->
    <rect x="15" y="65" width="75" height="55" rx="14" fill="url(#chromeGrad)" stroke="#475569" stroke-width="2"/>
    <!-- Dual Exhaust Pipes -->
    <g transform="rotate(-25 100 100)">
      <!-- Pipe 1 -->
      <path d="M 40 70 L 130 70 C 138 70 144 76 144 84 L 144 100 C 144 108 138 114 130 114 L 40 114 Z" fill="url(#chromeGrad)" stroke="#334155" stroke-width="2"/>
      <ellipse cx="130" cy="92" rx="14" ry="22" fill="#0F172A" stroke="url(#blueHeat)" stroke-width="4"/>
      <!-- Pipe 2 -->
      <path d="M 60 110 L 150 110 C 158 110 164 116 164 124 L 164 140 C 164 148 158 154 150 154 L 60 154 Z" fill="url(#chromeGrad)" stroke="#334155" stroke-width="2"/>
      <ellipse cx="150" cy="132" rx="14" ry="22" fill="#0F172A" stroke="url(#blueHeat)" stroke-width="4"/>
    </g>
  </g>
</svg>